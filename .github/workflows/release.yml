name: Release

# 推送 v* tag 时自动构建全平台二进制并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 全量拉取含 tag,兜底 git describe 版本号(VERSION 已显式传 tag 名)
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 构建全平台产物
        run: make dist VERSION=${GITHUB_REF_NAME}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
